<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SkillsTrack Sign In</title>
  <link rel="stylesheet" href="../CSS/styles.css">
</head>

<body>
  <main class="login-card">
    <header class="brand">
      <span class="brand-icon">▦</span>
      <strong>SKILLSTRACK STUDENT SUPPORT PORTAL</strong>
    </header>

    <h1>Sign in to portal</h1>
    <h2>STUDENT</h2>

        <div class="form-group">
        <label for="studentEmail">STUDENT EMAIL ADDRESS</label>
            <input
              type="email"
              id="studentEmail"
              name="studentEmail"
              placeholder="DimakatsoMosima@tpcstudents.co.za"
            >
          </div>

          <div class="form-group">
            <label for="studentPassword">PASSWORD</label>

            <div class="password-field">
              <input
                type="password"
                id="studentPassword"
                name="studentPassword"
                placeholder="••••••••"
              >

              <span class="lock-icon" aria-hidden="true">♙</span>
            </div>
          </div>
        </section>

        <section class="user-section assessor-section">
          <h2>ASSESSOR</h2>

          <div class="form-group">
            <label for="assessorEmail">ASSESSOR EMAIL ADDRESS</label>
            <input
              type="email"
              id="assessorEmail"
              name="assessorEmail"
              placeholder="Londeka@tpc.training"
            >
          </div>

          <div class="form-group">
            <label for="assessorPassword">PASSWORD</label>

            <div class="password-field">
              <input
                type="password"
                id="assessorPassword"
                name="assessorPassword"
                placeholder="••••••••"
              >

              <span class="lock-icon" aria-hidden="true">♙</span>
            </div>
          </div>
        </section>

        <button type="submit">SIGN IN</button>

        <p class="register-link">
          New to SkillsTrack?
          <a href="register.html">Register now</a>
        </p>
      </form>
    </section>
  </main>
</body>
</html>
