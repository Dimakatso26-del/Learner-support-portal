<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkillsTrack Code Challenge</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    [hidden] { display: none !important; }
    .game-message { min-height: 18px; margin: 8px 0; font-size: 13px; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <a class="brand" href="Dashboard-STUDENT.html">
        <span class="brand-icon">▦</span>
        <strong>SKILLSTRACK STUDENT SUPPORT PORTAL</strong>
      </a>

      <nav>
        <a href="Dashboard-STUDENT.html">Dashboard</a>
        <a href="Task-STUDENT.html">Tasks</a>
        <a href="Support-STUDENT.html">Support</a>
        <a class="active" href="Game-STUDENT.html">Game</a>
        <a href="Settings-STUDENT.html">Settings</a>
      </nav>

      <div class="account">
        <b id="userNameDisplay">Student</b>
        <i></i>
        <button id="signOutButton">Sign Out</button>
      </div>
    </header>

    <main>
      <div class="title">
        <div>
          <h1>Code Challenge</h1>
          <p>Test your skills in quick technical mock assessments.</p>
        </div>
        <button type="button" id="scoreButton">Score: 0</button>
      </div>

      <section class="quiz">
        <div class="meta">
          <b id="questionCounter">Question 1 of 10</b>
          <span id="questionCategory"></span>
        </div>

        <div class="progress"><i id="progressBar"></i></div>
        <small id="timerText"></small>

        <div class="question" id="questionText"></div>

        <div class="answers" id="answersBox"></div>

        <p id="gameMessage" class="game-message"></p>

        <div class="actions">
          <button type="button" id="skipButton">Skip Question</button>
          <button type="button" class="primary" id="nextButton">NEXT QUESTION</button>
        </div>
      </section>

      <section class="leaderboard">
        <h2>Leaderboard: High Scores</h2>
        <ol id="leaderboardList"></ol>
      </section>
    </main>
  </div>

  <script type="module" src="../src/game.js"></script>
</body>
</html>
