<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkillsTrack Settings</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .form-message { min-height: 18px; margin: 6px 0; font-size: 13px; }
    .form-message.error { color: #dc2626; }
    .form-message.ok { color: #16a34a; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <a class="brand" href="Dashboard-STUDENT.html">
        <span class="brand-icon">▦</span>
        <strong>SKILLSTRACK STUDENT SUPPORT PORTAL</strong>
      </a>

      <nav>
        <a href="Dashboard-STUDENT.html">Dashboard</a>
        <a href="Task-STUDENT.html">Tasks</a>
        <a href="Support-STUDENT.html">Support</a>
        <a href="Game-STUDENT.html">Game</a>
        <a class="active" href="Settings-STUDENT.html">Settings</a>
      </nav>

      <div class="account">
        <b id="userNameDisplay">Student</b>
        <i></i>
        <button id="signOutButton">Sign Out</button>
      </div>
    </header>

    <main>
      <h1>Settings</h1>
      <p class="lead">
        Manage your student portal accessibility preferences, appearance,
        and account information.
      </p>

      <div class="settings-grid">
        <section class="card">
          <h2>Portal Preferences</h2>
          <hr>

          <h3>THEME APPEARANCE</h3>
          <div class="theme-options">
            <button type="button" id="lightButton" class="selected">Light Mode</button>
            <button type="button" id="darkButton">Dark Mode</button>
          </div>

          <h3>DISPLAY FONT WEIGHT</h3>

          <label class="radio">
            <input type="radio" name="font-weight" id="weightRegular" checked>
            <span>Comfortable regular text</span>
          </label>

          <label class="radio">
            <input type="radio" name="font-weight" id="weightBold">
            <span>Enhanced visual emphasis</span>
          </label>

          <hr>
          <button type="button" class="clear-button" id="clearPreferencesButton">Clear Preferences</button>
        </section>

        <section class="card">
          <h2>Account Information</h2>
          <hr>

          <form id="profileForm">
            <label for="name">FULL PROFILE NAME</label>
            <input id="name" type="text">

            <label for="email">REGISTERED EMAIL ADDRESS</label>
            <input id="email" type="email" readonly>

            <hr>

            <p id="settingsMessage" class="form-message"></p>

            <button class="save-button" type="submit">SAVE CHANGES</button>
            <button class="danger-button" type="button" id="deleteAccountButton">DELETE ACCOUNT</button>
          </form>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="../src/settings.js"></script>
</body>
</html>
