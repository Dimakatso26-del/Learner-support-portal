<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkillsTrack Tasks</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header>
      <a class="brand">
        <span>▦</span>
        SKILLSTRACK STUDENT SUPPORT PORTAL
      </a>

      <nav>
        <a>Dashboard</a>
        <a class="active">Tasks</a>
        <a>Support</a>
        <a>Game</a>
        <a>Settings</a>
      </nav>

      <div class="account">
        <b>Dimakatso student</b>
        <i></i>
        <button>Sign Out</button>
      </div>
    </header>

    <main>
      <div class="title">
        <h1>My Tasks</h1>
        <button>+ ADD TASK</button>
      </div>

      <div class="filters">
        <input type="search" placeholder="⌕ Search tasks...">

        <select>
          <option>Category</option>
        </select>

        <select>
          <option>Due Date</option>
        </select>

        <select>
          <option>Sort</option>
        </select>

        <button>↕</button>
      </div>

      <section class="table">
        <div class="tr head">
          <span>□</span>
          <b>TASK TITLE</b>
          <b>CATEGORY</b>
          <b>DUE DATE</b>
          <b>ACTIONS</b>
        </div>

        <div class="tr">
          <span>▣</span>
          <span>Digital foundations</span>
          <span>Theory</span>
          <span>25 Feb 2026</span>
          <span>✎ &nbsp; ♧</span>
        </div>

        <div class="tr">
          <span>□</span>
          <span>Coding basics with JavaScript</span>
          <span>Coding</span>
          <span>Yesterday</span>
          <span>✎ &nbsp; ♧</span>
        </div>

        <div class="tr">
          <span>□</span>
          <span>Project: JavaScript</span>
          <span>Coding</span>
          <span>In 5 days</span>
          <span>✎ &nbsp; ♧</span>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
