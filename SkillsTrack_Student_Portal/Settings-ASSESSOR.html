<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Support Portal</title>
  <link rel="stylesheet" href="Settings-ASSESSOR.css">
  <style>
    .form-message { min-height: 18px; font-size: 13px; }
    .form-message.error { color: #dc2626; }
    .form-message.ok { color: #16a34a; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand">SKILLSTRACK STUDENT SUPPORT PORTAL</div>
    <ul class="nav-links">
      <li><a href="Dashboard_Support-ASSESSOR.html">Dashboard</a></li>
      <li><a href="Progress_Tracker-ASSESSOR.html">Students</a></li>
      <li><a href="Bookings-ASSESSOR.html">Bookings</a></li>
      <li><a href="Settings-ASSESSOR.html" class="active">Settings</a></li>
    </ul>
    <div class="nav-user">
      <span id="userNameDisplay">Assessor</span>
      <button class="btn-signout" id="signOutButton">Sign Out</button>
    </div>
  </nav>

  <div class="container">
    <header>
      <h1>Settings</h1>
      <p class="subtitle">Adjust your dashboard views, notification parameters, and core assessor account settings.</p>
    </header>

    <main class="settings-grid">

      <section class="settings-card">
        <h2 class="card-title">Assessor Preferences</h2>

        <div class="form-group">
          <label class="field-label">Theme Appearance</label>
          <div class="toggle-group">
            <button type="button" id="lightButton" class="btn-toggle active">Light Mode</button>
            <button type="button" id="darkButton" class="btn-toggle text-muted">Dark Mode (Grayscale)</button>
          </div>
        </div>

        <div class="form-group">
          <label class="field-label">Notification Preferences</label>
          <div class="checkbox-item">
            <input type="checkbox" id="notify-bookings" checked>
            <label for="notify-bookings">Email notifications for new bookings</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="notify-late" checked>
            <label for="notify-late">Email notifications for late task submissions</label>
          </div>
          <div class="checkbox-item">
            <input type="checkbox" id="weekly-digest">
            <label for="weekly-digest">Weekly digest of learner statistics</label>
          </div>
        </div>

        <div class="form-group">
          <label class="field-label" for="landing-view">Default Landing View</label>
          <select id="landing-view" class="select-input">
            <option value="dashboard">Dashboard (Default)</option>
            <option value="students">Students</option>
            <option value="bookings">Bookings</option>
          </select>
        </div>
      </section>

      <section class="settings-card">
        <h2 class="card-title">Account Information</h2>

        <form id="profileForm">
          <div class="form-group">
            <label class="field-label" for="profile-name">Full Profile Name</label>
            <input type="text" id="profile-name" class="text-input">
          </div>

          <div class="form-group">
            <label class="field-label" for="email-address">Registered Email Address</label>
            <input type="email" id="email-address" class="text-input" readonly>
          </div>

          <div class="form-group">
            <label class="field-label" for="system-role">System Privilege Role</label>
            <input type="text" id="system-role" class="text-input" value="Assessor" readonly>
          </div>

          <p id="settingsMessage" class="form-message"></p>

          <div class="action-buttons">
            <button type="submit" class="btn-primary">Save Changes</button>
            <button type="button" class="btn-danger" id="signOutAccountButton">Sign Out Account</button>
          </div>
        </form>
      </section>

    </main>
  </div>

  <script type="module" src="../src/settings-assessor.js"></script>
</body>
</html>
