<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookings - Support Portal</title>
  <link rel="stylesheet" href="Bookings-ASSESSOR.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand">SKILLSTRACK STUDENT SUPPORT PORTAL</div>
    <ul class="nav-links">
      <li><a href="Dashboard_Support-ASSESSOR.html">Dashboard</a></li>
      <li><a href="Progress_Tracker-ASSESSOR.html">Students</a></li>
      <li><a href="Bookings-ASSESSOR.html" class="active">Bookings</a></li>
      <li><a href="Settings-ASSESSOR.html">Settings</a></li>
    </ul>
    <div class="nav-user">
      <span id="userNameDisplay">Assessor</span>
      <button class="btn-signout" id="signOutButton">Sign Out</button>
    </div>
  </nav>

  <div class="container">
    <header>
      <h1>Bookings</h1>
      <p class="subtitle">Review, confirm, or reschedule individual learner 1-on-1 support sessions.</p>
      <p id="pageMessage"></p>
    </header>

    <section class="metrics-row">
      <div class="metric-card">
        <div class="metric-label">Pending Bookings</div>
        <div class="metric-value" id="pendingCount">0</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Confirmed Bookings</div>
        <div class="metric-value" id="confirmedCount">0</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Completed Bookings</div>
        <div class="metric-value" id="completedCount">0</div>
      </div>
    </section>

    <div class="controls-row">
      <select id="statusFilter">
        <option value="">Status: All</option>
        <option value="pending">Pending</option>
        <option value="confirmed">Confirmed</option>
        <option value="completed">Completed</option>
        <option value="declined">Declined</option>
        <option value="cancelled">Cancelled</option>
      </select>
      <select id="rangeFilter">
        <option value="all">Date Range: All dates</option>
        <option value="next5">Date Range: Next 5 Days</option>
        <option value="next30">Date Range: Next 30 Days</option>
        <option value="past">Date Range: Past</option>
      </select>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Student Name</th>
            <th>Topic</th>
            <th>Date</th>
            <th>Time</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="bookingsBody"></tbody>
      </table>
    </div>
  </div>

  <script type="module" src="../src/bookings-assessor.js"></script>
</body>
</html>
