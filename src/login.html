<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — SkillsTrack Learner Support Portal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page">

  <main class="auth-card">
    <header class="card-header">
      <span class="brand-icon">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2" y="2" width="12" height="4" rx="1"></rect>
          <rect x="2" y="8" width="5" height="6" rx="1"></rect>
          <rect x="9" y="8" width="5" height="6" rx="1"></rect>
        </svg>
      </span>
      <span class="brand">SKILLSTRACK LEARNER SUPPORT PORTAL</span>
    </header>

    <h1 class="card-title">Sign in to portal</h1>

    <div class="role-tabs">
      <button type="button" id="showStudentLogin" class="role-tab active">STUDENT</button>
      <button type="button" id="showAssessorLogin" class="role-tab">ASSESSOR</button>
    </div>

    <form id="studentLoginForm" class="auth-form">
      <div class="form-group">
        <label for="studentEmail">Email address</label>
        <input type="email" id="studentEmail" required />
      </div>

      <div class="form-group">
        <label for="studentPassword">Password</label>
        <input type="password" id="studentPassword" required />
      </div>

      <p id="studentLoginError" class="form-error"></p>

      <button type="submit" class="btn-primary">SIGN IN</button>
    </form>

    <form id="assessorLoginForm" class="auth-form" style="display: none;">
      <div class="form-group">
        <label for="assessorEmail">Email address</label>
        <input type="email" id="assessorEmail" required />
      </div>

      <div class="form-group">
        <label for="assessorPassword">Password</label>
        <input type="password" id="assessorPassword" required />
      </div>

      <p id="assessorLoginError" class="form-error"></p>

      <button type="submit" class="btn-primary">SIGN IN</button>
    </form>

    <p class="card-footer">New to SkillsTrack? <a href="register.html">Register now</a></p>
  </main>

  <script>
    const studentTab = document.getElementById("showStudentLogin");
    const assessorTab = document.getElementById("showAssessorLogin");
    const studentForm = document.getElementById("studentLoginForm");
    const assessorForm = document.getElementById("assessorLoginForm");

    studentTab.addEventListener("click", () => {
      studentForm.style.display = "block";
      assessorForm.style.display = "none";
      studentTab.classList.add("active");
      assessorTab.classList.remove("active");
    });

    assessorTab.addEventListener("click", () => {
      studentForm.style.display = "none";
      assessorForm.style.display = "block";
      assessorTab.classList.add("active");
      studentTab.classList.remove("active");
    });
  </script>

  <script type="module" src="login.js"></script>

</body>
</html>
