<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">SkillsTrack Student Support Portal</title>
  <desc id="desc">A monitor, paper plane, and the Skills Track brand wordmark.</desc>
  <defs>
    <linearGradient id="monitorGlow" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#f6b22a"/>
      <stop offset="28%" stop-color="#ff7a59"/>
      <stop offset="72%" stop-color="#ff4498"/>
      <stop offset="100%" stop-color="#7a42ff"/>
    </linearGradient>
    <linearGradient id="planeFill" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb13f"/>
      <stop offset="26%" stop-color="#ff7a59"/>
      <stop offset="55%" stop-color="#ff4ea5"/>
      <stop offset="100%" stop-color="#7b46ff"/>
    </linearGradient>
    <linearGradient id="screenFill" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#8d47ff"/>
      <stop offset="100%" stop-color="#5f2de1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g transform="translate(0 0)" filter="url(#shadow)">
    <rect x="170" y="130" width="420" height="285" rx="18" fill="none" stroke="url(#monitorGlow)" stroke-width="10"/>
    <rect x="206" y="168" width="348" height="208" rx="10" fill="url(#screenFill)"/>
    <path d="M180 430 C 305 364, 420 366, 560 420" fill="none" stroke="#f6f6f6" stroke-width="24" stroke-linecap="round"/>
    <path d="M245 430 L570 430" stroke="url(#monitorGlow)" stroke-width="10" stroke-linecap="round"/>
    <path d="M360 430 L360 490" stroke="#f6f6f6" stroke-width="14" stroke-linecap="round"/>
    <path d="M300 490 L430 490" stroke="#f6f6f6" stroke-width="14" stroke-linecap="round"/>

    <g transform="translate(585 90) rotate(28)">
      <path d="M0 26 L214 0 L150 84 L260 112 L80 140 L46 220 L16 170 L-18 197 L0 26 Z" fill="url(#planeFill)"/>
      <path d="M0 26 L214 0 L150 84 L0 26 Z" fill="#ffffff" opacity="0.22"/>
      <path d="M0 26 L80 140 L16 170 L0 26 Z" fill="#f5d2e8" opacity="0.22"/>
    </g>
  </g>

  <text x="110" y="440" font-size="122" font-family="Segoe UI, Arial, sans-serif" font-weight="800" fill="#f7f4f3" letter-spacing="0">SKILLS TRACK</text>
  <text x="315" y="495" font-size="38" font-family="Segoe UI, Arial, sans-serif" font-weight="600" fill="#f7f4f3" letter-spacing="10">STUDENT SUPPORT PORTAL</text>
</svg>
