<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students - Support Portal</title>
  <link rel="stylesheet" href="Progress_Tracker-ASSESSOR.css">
  <style>
    dialog { max-width: 480px; width: 90%; border: 1px solid #d1d5db; border-radius: 8px; padding: 20px; }
    dialog ul { padding-left: 18px; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand">SKILLSTRACK STUDENT SUPPORT PORTAL</div>
    <ul class="nav-links">
      <li><a href="Dashboard_Support-ASSESSOR.html">Dashboard</a></li>
      <li><a href="Progress_Tracker-ASSESSOR.html" class="active">Students</a></li>
      <li><a href="Bookings-ASSESSOR.html">Bookings</a></li>
      <li><a href="Settings-ASSESSOR.html">Settings</a></li>
    </ul>
    <div class="nav-user">
      <span id="userNameDisplay">Assessor</span>
      <button class="btn-signout" id="signOutButton">Sign Out</button>
    </div>
  </nav>

  <div class="container">
    <header>
      <h1>Students</h1>
      <p class="subtitle">Manage, monitor progress, and review portal files for registered learners.</p>
      <p id="pageMessage"></p>
    </header>

    <div class="controls-row">
      <div class="search-container">
        <input type="text" class="search-input" id="searchInput" placeholder="Search students by name or email...">
      </div>
      <select id="statusFilter">
        <option value="">Filter: All Statuses</option>
        <option value="On Track">On Track</option>
        <option value="At Risk">At Risk</option>
      </select>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Students Name</th>
            <th>Email</th>
            <th>Tasks Completed</th>
            <th>Completion %</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="studentsBody"></tbody>
      </table>

      <div class="pagination-row">
        <div id="showingText"></div>
        <div class="pagination-pages" id="pageLinks"></div>
      </div>
    </div>
  </div>

  <dialog id="profileDialog"></dialog>

  <script type="module" src="../src/students-assessor.js"></script>
</body>
</html>
