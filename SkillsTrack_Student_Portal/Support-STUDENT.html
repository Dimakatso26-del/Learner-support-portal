<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkillsTrack Support</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .form-message { min-height: 18px; margin: 6px 0; font-size: 13px; }
    .form-message.error { color: #dc2626; }
    .form-message.ok { color: #16a34a; }
    .empty-msg { padding: 14px; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <a class="brand" href="Dashboard-STUDENT.html">
        <span class="brand-icon">▦</span>
        <strong>SKILLSTRACK STUDENT SUPPORT PORTAL</strong>
      </a>

      <nav>
        <a href="Dashboard-STUDENT.html">Dashboard</a>
        <a href="Task-STUDENT.html">Tasks</a>
        <a class="active" href="Support-STUDENT.html">Support</a>
        <a href="Game-STUDENT.html">Game</a>
        <a href="Settings-STUDENT.html">Settings</a>
      </nav>

      <div class="account">
        <b id="userNameDisplay">Student</b>
        <i></i>
        <button id="signOutButton">Sign Out</button>
      </div>
    </header>

    <main>
      <h1>Book Support Session</h1>
      <p class="lead">
        One-on-one scheduled contact session with the Assessor
      </p>

      <div class="columns">
        <form id="bookingForm">
          <h2>New Booking Request</h2>
          <hr>

          <label for="module">SUBJECT / TOPIC / MODULE</label>
          <select id="module">
            <option value="">Select a topic</option>
            <option>Computing Fundamentals</option>
            <option>Thinking Like a Programmer</option>
            <option>Coding Basics with JavaScript</option>
            <option>Project: JavaScript</option>
          </select>

          <label for="date">PREFERRED DATE</label>
          <input id="date" type="date">

          <label for="time">PREFERRED TIME</label>
          <select id="time">
            <option value="">Select a time</option>
            <option>08:00</option>
            <option>09:00</option>
            <option>10:00</option>
            <option>11:00</option>
            <option>12:00</option>
            <option>13:00</option>
            <option>14:00</option>
            <option>15:00</option>
            <option>16:00</option>
          </select>

          <label for="notes">ADDITIONAL NOTES</label>
          <textarea
            id="notes"
            placeholder="Describe what you need help with..."
          ></textarea>

          <p id="bookingMessage" class="form-message"></p>

          <button type="submit">SUBMIT BOOKING</button>
        </form>

        <section id="myBookings">
          <h2>My Bookings</h2>

          <div class="booking head">
            <b>TOPIC</b>
            <b>DATE &amp; TIME</b>
            <b>STATUS</b>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="../src/support.js"></script>
</body>
</html>
